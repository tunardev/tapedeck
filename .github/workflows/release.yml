name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: setup zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      - name: test
        run: zig build test --summary all

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos, aarch64-macos]
    steps:
      - name: checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: setup zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      - name: version matches the tag
        run: |
          zon=$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon)
          test "v$zon" = "${{ github.ref_name }}"
      - name: build ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --prefix out
      - name: smoke test
        if: matrix.target == 'x86_64-linux-musl'
        run: ./out/bin/tapedeck --version
      - name: package
        run: |
          tar -C out/bin -czf tapedeck-${{ matrix.target }}.tar.gz tapedeck
          sha256sum tapedeck-${{ matrix.target }}.tar.gz > tapedeck-${{ matrix.target }}.tar.gz.sha256
      - name: upload artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tapedeck-${{ matrix.target }}
          path: tapedeck-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: download artifacts v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          path: dist
      - name: collect checksums
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256
      - name: publish v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
