name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - run: zig build test --summary all

  build:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --prefix out
      - name: smoke test the native artifact
        if: matrix.target == 'x86_64-linux-musl'
        run: ./out/bin/tapedeck --version
      - name: package
        run: |
          tar -C out/bin -czf tapedeck-${{ matrix.target }}.tar.gz tapedeck
          sha256sum tapedeck-${{ matrix.target }}.tar.gz > tapedeck-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tapedeck-${{ matrix.target }}
          path: tapedeck-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: collect checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS && rm dist/*.sha256
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
