name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  EXPECTED_TEST_BINARIES: 6

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: checkout v5.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      - name: test
        run: |
          zig build test --summary all 2>&1 | tee summary.txt
          grep -qE 'Build Summary: [0-9]+/[0-9]+ steps succeeded; [0-9]+/[0-9]+ tests passed[[:space:]]*$' summary.txt
          test "$(grep -cE 'run test [0-9]+ pass' summary.txt)" -eq "$EXPECTED_TEST_BINARIES"
      - name: test release mode
        run: zig build test -Doptimize=ReleaseSafe
      - name: format
        run: zig fmt --check src build.zig tests

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos, aarch64-macos]
    steps:
      - name: checkout v5.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      - name: build ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
