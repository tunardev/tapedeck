name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A new push to the same branch/PR makes the previous run's results moot;
# cancel it instead of burning runner minutes on output no one will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms even when one fails; otherwise a Linux failure
      # cancels macOS and hides whether it would have failed too.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          # Pinned: zig has no stable release, and a minor bump reliably
          # renames something in std. Raise this deliberately, never implicitly.
          version: 0.16.0
      - run: zig build test --summary all
      - run: zig fmt --check src build.zig

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
